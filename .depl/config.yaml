project_name: impulse-ring
version: 9
ignore_files:
  - .git
  - target
cache_files:
  - target
variables:
  empty:
    value:
      type: plain
      value: ""
  package-connector:
    value:
      type: plain
      value: impulse-ring-connector
  package-core:
    value:
      type: plain
      value: impulse-ring-core
  package-impulsed:
    value:
      type: plain
      value: impulsed
  target-amd64:
    value:
      type: plain
      value: x86_64-unknown-linux-gnu
actions:
  - info: cargo-fmt@0.1.0
    requirements:
      - type: in_path
        executable: cargo
        desc: "Install `cargo` via your package manager or with this command: `curl https://sh.rustup.rs -sSf | sh`."
    # cargo-fmt rewrites source in place, so it must run in the project dir.
    exec_in_project_dir: true
    skip_sync: false
    action:
      type: staged
      stage: build
      cmd: cargo fmt -- --config tab_spaces=2,max_width=120 $(find . -name "*.rs" -not -path "*/target/*")
  - info: cargo-lint@0.2.0
    requirements:
      - type: in_path
        executable: cargo
        desc: "Install `cargo` via your package manager or with this command: `curl https://sh.rustup.rs -sSf | sh`."
    action:
      type: staged
      stage: build
      cmd: "{flags}cargo clippy --package {package} --target {target}{features}"
      placeholders:
        - "{flags}"
        - "{package}"
        - "{target}"
        - "{features}"
      show_success_output: true
  - info: cargo-release@0.2.0
    tags:
      - rust
      - cargo
    requirements:
      - type: in_path
        executable: cargo
        desc: "Install `cargo` via your package manager or with this command: `curl https://sh.rustup.rs -sSf | sh`."
    action:
      type: staged
      stage: build
      cmd: "{flags}cargo build --release --package {package} --target {target}"
      placeholders:
        - "{flags}"
        - "{package}"
        - "{target}"
  - info: run-connector-demo@0.1.0
    action:
      type: observe
      cmd: cargo run -p impulse-ring-connector --example demo
      ignore_fails: true
      show_success_output: true
      show_cmd: false
      only_when_fresh: false
  - info: run-impulsed@0.1.0
    action:
      type: observe
      cmd: ./target/x86_64-unknown-linux-gnu/release/impulsed
      ignore_fails: true
      show_success_output: true
      show_cmd: false
      only_when_fresh: false
  - info: run-impulsed-daemon@0.1.0
    action:
      type: custom
      cmd: ./target/x86_64-unknown-linux-gnu/release/impulsed
      daemon: true
      daemon_wait_seconds: 2
  # ---- connector linting & formatting (2-space / 120 cols where the tool allows) ----
  - info: clang-format-check@0.1.0
    requirements:
      - type: in_path
        executable: clang-format
        desc: "Install clang-format (LLVM): apt install clang-format"
    action:
      type: staged
      stage: build
      cmd: clang-format --dry-run --Werror connectors/c/src/*.c connectors/c/include/*.h connectors/c/examples/*.c connectors/c/tests/*.c connectors/cpp/include/*.hpp connectors/cpp/examples/*.cpp connectors/cpp/tests/*.cpp
      show_success_output: true
  - info: clang-tidy@0.1.0
    requirements:
      - type: in_path
        executable: clang-tidy
        desc: "Install clang-tidy (LLVM): apt install clang-tidy"
    action:
      type: staged
      stage: build
      cmd: clang-tidy connectors/c/src/impulse_ring.c -- -Iconnectors/c/include -D_GNU_SOURCE
      show_success_output: true
  - info: ruff-check@0.1.0
    requirements:
      - type: in_path
        executable: uv
        desc: "Install uv: curl -LsSf https://astral.sh/uv/install.sh | sh"
    action:
      type: staged
      stage: build
      cmd: uvx ruff check connectors/python
      show_success_output: true
  - info: ruff-format-check@0.1.0
    requirements:
      - type: in_path
        executable: uv
        desc: "Install uv: curl -LsSf https://astral.sh/uv/install.sh | sh"
    action:
      type: staged
      stage: build
      cmd: uvx ruff format --check connectors/python
      show_success_output: true
  - info: go-fmt-check@0.1.0
    requirements:
      - type: in_path
        executable: gofmt
        desc: "Install Go: https://go.dev/dl"
    action:
      type: staged
      stage: build
      cmd: bash -c 'test -z "$(gofmt -l connectors/go)"'
      show_success_output: true
  - info: go-vet@0.1.0
    requirements:
      - type: in_path
        executable: go
        desc: "Install Go: https://go.dev/dl"
    action:
      type: staged
      stage: build
      cmd: bash -c 'cd connectors/go && go vet ./...'
      show_success_output: true
  # ---- connector example builds & runs (replaces the per-connector shell scripts) ----
  - info: build-c-connector@0.1.0
    requirements:
      - type: in_path
        executable: cmake
        desc: "Install cmake."
    action:
      type: staged
      stage: build
      cmd: bash -c 'cmake -S connectors/c -B connectors/c/build -DCMAKE_BUILD_TYPE=Release && cmake --build connectors/c/build'
  - info: build-python-ext@0.1.0
    requirements:
      - type: in_path
        executable: python3
        desc: "Install Python 3 with development headers."
    action:
      type: staged
      stage: build
      cmd: bash -c 'cd connectors/python && python3 setup.py build_ext --inplace'
  - info: run-c-demo@0.1.0
    action:
      type: observe
      cmd: ./connectors/c/build/ir_demo
      ignore_fails: true
      show_success_output: true
      show_cmd: false
      only_when_fresh: false
  - info: run-python-demo@0.1.0
    action:
      type: observe
      cmd: python3 connectors/python/examples/demo.py
      ignore_fails: true
      show_success_output: true
      show_cmd: false
      only_when_fresh: false
  - info: run-go-demo@0.1.0
    action:
      type: observe
      cmd: bash -c 'cd connectors/go && go run ./examples/demo'
      ignore_fails: true
      show_success_output: true
      show_cmd: false
      only_when_fresh: false
  - info: build-cpp-connector@0.1.0
    requirements:
      - type: in_path
        executable: cmake
        desc: "Install cmake and a C++17 compiler."
    action:
      type: staged
      stage: build
      cmd: bash -c 'cmake -S connectors/cpp -B connectors/cpp/build -DCMAKE_BUILD_TYPE=Release && cmake --build connectors/cpp/build'
  - info: run-cpp-demo@0.1.0
    action:
      type: observe
      cmd: ./connectors/cpp/build/irpp_demo
      ignore_fails: true
      show_success_output: true
      show_cmd: false
      only_when_fresh: false
  - info: ts-check@0.1.0
    requirements:
      - type: in_path
        executable: bun
        desc: "Install Bun: curl -fsSL https://bun.sh/install | bash"
    action:
      type: staged
      stage: build
      cmd: bash -c 'cd connectors/ts && bun build src/index.ts examples/demo.ts --target=bun --outdir=/tmp/ir-ts-build >/dev/null'
      show_success_output: true
  - info: run-ts-demo@0.1.0
    action:
      type: observe
      cmd: bash -c 'cd connectors/ts && bun run examples/demo.ts'
      ignore_fails: true
      show_success_output: true
      show_cmd: false
      only_when_fresh: false
  - info: run-benchmark@0.1.0
    requirements:
      - type: in_path
        executable: cargo
        desc: "Install cargo (rustup)."
      - type: in_path
        executable: cmake
        desc: "Install cmake and a C/C++ compiler."
      - type: in_path
        executable: go
        desc: "Install Go: https://go.dev/dl"
      - type: in_path
        executable: bun
        desc: "Install Bun: https://bun.sh"
    action:
      type: observe
      # Reduced lap count keeps CI fast; the default (benchmark/run.sh) is 1,000,000.
      cmd: bash -c 'BENCH_LAPS=2000 ./benchmark/run.sh'
      ignore_fails: true
      show_success_output: true
      show_cmd: false
      only_when_fresh: false
pipelines:
  - title: common-ops
    info: impulse-ring-common-ops@0.1.0
    actions:
      - title: Format
        used: cargo-fmt@0.1.0
      - title: Lint `impulse-ring-core`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-core
          "{target}": target-amd64
      - title: Lint `impulse-ring-connector`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-connector
          "{target}": target-amd64
      - title: Lint `impulsed`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-impulsed
          "{target}": target-amd64
      - title: Build `impulsed`
        used: cargo-release@0.2.0
        with:
          "{flags}": empty
          "{package}": package-impulsed
          "{target}": target-amd64
    artifacts:
      - from: target/x86_64-unknown-linux-gnu/release/impulsed
        to: impulsed
  - title: demo
    info: impulse-ring-demo@0.1.0
    actions:
      - title: Run `impulsed`
        used: run-impulsed-daemon@0.1.0
      - title: Run test
        used: run-connector-demo@0.1.0
      - title: Run test second time
        used: run-connector-demo@0.1.0
  - title: lint-connectors
    info: impulse-ring-lint-connectors@0.1.0
    actions:
      - title: Check C/C++ format (clang-format)
        used: clang-format-check@0.1.0
      - title: Lint C (clang-tidy)
        used: clang-tidy@0.1.0
      - title: Lint Python (ruff)
        used: ruff-check@0.1.0
      - title: Check Python format (ruff)
        used: ruff-format-check@0.1.0
      - title: Check Go format (gofmt)
        used: go-fmt-check@0.1.0
      - title: Vet Go (go vet)
        used: go-vet@0.1.0
      - title: Check TS (bun build)
        used: ts-check@0.1.0
  - title: connector-examples
    info: impulse-ring-connector-examples@0.1.0
    actions:
      - title: Build C connector
        used: build-c-connector@0.1.0
      - title: Build C++ connector
        used: build-cpp-connector@0.1.0
      - title: Build Python extension
        used: build-python-ext@0.1.0
      - title: Run `impulsed`
        used: run-impulsed-daemon@0.1.0
      - title: Run C example
        used: run-c-demo@0.1.0
      - title: Run C++ example
        used: run-cpp-demo@0.1.0
      - title: Run Python example
        used: run-python-demo@0.1.0
      - title: Run Go example
        used: run-go-demo@0.1.0
      - title: Run TS example
        used: run-ts-demo@0.1.0
  - title: benchmark
    info: impulse-ring-benchmark@0.1.0
    actions:
      - title: Cross-language ring relay benchmark
        used: run-benchmark@0.1.0
